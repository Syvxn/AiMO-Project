[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Aimo multi-agent-system"
version = "0.1.0"
description = "Basic multi-agent system skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.50",
  "langchain-core>=0.3.0",
  "langchain-huggingface>=0.1.0",
  "transformers>=4.45.0",
  "accelerate>=0.34.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.9.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
quiz-run = "aimo_agents.app.runner:run_cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
