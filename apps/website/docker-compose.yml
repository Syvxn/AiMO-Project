services:
  agents:
    build:
      context: ../agents
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ../agents/src:/app/src
      - ../agents/data:/app/data
      - material_uploads:/app/data/materials/uploads
      - hf_cache:/root/.cache/huggingface
    environment:
      DEVICE_MAP: cpu
      MAX_NEW_TOKENS: "128"
      MATERIAL_DIR: /app/data/materials
    expose:
      - "8001"

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
    expose:
      - "3000"
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./apps/api:/app
      - material_uploads:/app/uploaded_materials
    environment:
      APP_ENV: development
      SECRET_KEY: ${API_SECRET_KEY:-change-me}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AGENTS_SERVICE_URL: http://agents:8001
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
  hf_cache:
  material_uploads:
